# Per-PR evidence-flow check: runs flow/audit-evidence.sh (issue #109).
#
# Separate from signoff.yml, rtl-sim.yml and fabulous-nextpnr.yml on purpose
# (signoff.yml's bytes are bound by the item-10 envelope). Path-filtered only.
#
# audit-evidence.sh needs no klt, OpenROAD, yosys, PDK install or network: it
# re-derives the claim -> harness -> pinned-PDK audit from committed files and
# flow/tool_versions.sh (the single pin source; no version is repeated here).
# It exits non-zero on a drifted claim or script hash.
#
# The klt-driven check modes (layout.sh, drc.sh, lvs.sh, layout_routed.sh) and
# the heavy sta-sweep.sh / sdf-resim.sh legs are deliberately NOT run here; see
# flow/README.md "Continuous integration" for the specific blockers.
#
# The sim/ ledger append-only guard (issue #183, flow/audit_sim_ledgers.py)
# compares the merge base of the event's base/head SHAs with the actual PR
# head SHA -- never the synthetic merge commit actions/checkout leaves at
# HEAD -- so it needs full history (fetch-depth: 0) and both event SHAs.
# The SHAs reach the shell only through env vars, quoted. `sim/**` selects
# ledger-only edits, deletions and newly named ledgers.
name: flow-evidence

on:
  pull_request:
    paths:
      - 'flow/**'
      - 'design/rtl/logic_tile.v'
      - 'design/bitstream-format.md'
      - 'sim/**'
      - 'layout/**'
      - 'measurements/**'
      - 'README.md'
      - 'spec/framework-gaps.md'
      - 'spec/decisions/**'
      - 'signoff/tier-report.json'
      - '.github/workflows/flow-evidence.yml'

permissions:
  contents: read

jobs:
  audit-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check sim/ ledgers are append-only
        env:
          LEDGER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LEDGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I flow/test_audit_sim_ledgers.py
          for sha in "$LEDGER_BASE_SHA" "$LEDGER_HEAD_SHA"; do
            if [ -z "$sha" ]; then
              echo "ERROR: pull_request base/head SHA missing from the event" >&2
              exit 2
            fi
            git cat-file -e "$sha^{commit}" 2>/dev/null \
              || git fetch --no-tags origin "$sha"
          done
          python3 -I flow/audit_sim_ledgers.py \
            --base "$LEDGER_BASE_SHA" --head "$LEDGER_HEAD_SHA"

      - name: Audit claim-to-harness evidence
        run: |
          python3 -I flow/test_audit_evidence.py
          ./flow/audit-evidence.sh

      - name: Check README/framework-gaps status claims
        run: |
          python3 flow/test_check_status_claims.py
          python3 flow/check_status_claims.py

      - name: Check generated harness bitstream-format document is current
        run: |
          python3 flow/test_gen_bitstream_format.py
          python3 flow/gen_bitstream_format.py --check

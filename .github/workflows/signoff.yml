# .github/workflows/signoff.yml
#
# Re-grade this block's gap-to-T1 state from the committed signoff manifest
# (issue #52) -- the "CI re-runs it" leg of the manifest's rot protection.
#
# Two gates, catching the two ways the record can go stale:
#
#   1. verify-pins.sh -- every content_hash the manifest pins is re-checked
#      against the LIVE bytes of the artifact it pins, so a layout or supply-
#      spec change that lands without re-running the corresponding flow
#      script fails here even though the committed envelope still agrees
#      with the stale hash it carries.
#   2. klt signoff --manifest is re-run and its output byte-diffed against
#      the committed evidence record (signoff/tier-report.json), so a
#      regenerated/edited envelope, a manifest edit, or a grading-relevant
#      klt change that is not accompanied by a fresh record fails the build
#      instead of quietly diverging from what the repo claims.
#
# On pull_request runs there is a third, pre-merge gate before either of
# those (issue #304): the checked-out ref is merged with the CURRENT
# origin/main tip fetched at run time, so the gates judge the tree that
# would actually land rather than GitHub's cached merge ref computed when
# the run was queued. The gate enforces a cross-file invariant (an
# envelope's content_hash pins another file's bytes), so two PRs with
# disjoint file sets can each be green and still break it together where
# they meet on main (#297/#298): one edits an inventoried file, the other
# pins its pre-edit hash, git merges cleanly, and the stale pairing lands
# red at the merge commit. The guard fails the run -- with the stale-base
# diagnosis and the rebase-and-re-attest remedy -- when that run-time merge
# conflicts, or when the gate passes on the PR ref alone but fails on the
# merge. push-to-main runs skip the step: the checkout already is the
# merged state.

#
# `klt signoff --manifest` exits 3 when the block is not yet T1 (some item is
# unmet) -- that is a successful, expected run today, not a CI failure. The
# gate is the diff, not the exit code; exit 0 (T1 reached) and 3 (not yet)
# both pass, everything else fails.
#
# klt is pinned to the PyPI release the committed tier report was graded
# with (its bundled copy of docs/design-evidence-tiers.md fixes the item
# skeleton and its text, so a floating install would churn the record):
# klayout-tools==0.9.1 (tag v0.9.1). That grader re-hashes the artifact each
# item 1/2/9/10 envelope names in provenance.input (item 1's envelope carries
# the whole input set in provenance.input.paths; klayout-tools#2718), which is
# what lets this repo cite those four rows, and accepts the recorded
# item 6 not_applicable form (see signoff/README.md). This pin is independent
# of flow/tool_versions.sh's RECORDED_KLT_VERSION, which governs the design-flow
# evidence (see layout/README.md's "ERC scope, concretely" for the same
# split); bump it deliberately, together with a regenerated
# signoff/tier-report.json, when a new klt must re-grade the manifest.
#
# Items 1, 9 and 10 are tool-produced (issue #236): their envelopes come from
# `klt signoff --attest N --inventory signoff/item-N-inventory.json`, and the
# attest-check step below re-attests each one and fails (exit 3) when any
# inventoried file -- RTL, testbench, README, spec, LICENSE, or a workflow --
# changed without a refreshed envelope. This file is itself an item-10
# inventory member: any edit here (including to this comment) requires
# re-running the steps in signoff/README.md ("Regenerate and verify").

name: signoff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        # Full history: the base-freshness guard below merges the live
        # origin/main tip into this ref, which needs a shared ancestor. The
        # default depth-1 clone leaves the two histories unrelated and git
        # refuses the merge ("unrelated histories") on every pull_request
        # run (same requirement as flow-evidence.yml's checkout).
        with:
          fetch-depth: 0

      - name: Base-freshness guard (issue #304) -- merge the live main tip before gating
        # pull_request-only (see the header comment): gate the tree that
        # would actually land -- this PR merged with origin/main's CURRENT
        # tip -- not the cached merge ref from when the run was queued.
        # Runs before everything below, so every gate judges the merged
        # tree. /tmp/pins-pr-branch.rc records whether the gate passes on
        # the checked-out PR ref alone; the "Verify every manifest pin"
        # step below reads it to tell the two failure shapes apart.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if ./signoff/verify-pins.sh > /tmp/pins-pr-branch.log 2>&1; then
            echo 0 > /tmp/pins-pr-branch.rc
            echo "gate baseline on the checked-out PR ref: clean"
          else
            echo 1 > /tmp/pins-pr-branch.rc
            echo "gate baseline on the checked-out PR ref: FAILED"
            cat /tmp/pins-pr-branch.log
            echo "(if the merged-tree gate below passes, origin/main already carries the fix -- rebase onto it)"
          fi
          git fetch origin main
          git config user.name "signoff-base-freshness-guard"
          git config user.email "signoff-base-freshness-guard@users.noreply.github.com"
          if ! git merge origin/main --no-edit > /tmp/signoff-guard-merge.log 2>&1; then
            git diff --name-only --diff-filter=U > /tmp/signoff-conflicted.txt
            if [ ! -s /tmp/signoff-conflicted.txt ]; then
              # non-zero merge with zero unmerged paths: git refused to start
              # the merge at all (e.g. "refusing to merge unrelated histories"
              # under a shallow checkout) -- an environment/history problem,
              # not a stale base, so it gets its own diagnosis rather than a
              # phantom-conflict one.
              echo "::error::run-time merge with origin/main was REFUSED with no unmerged paths: a git/environment problem, not a stale base. git said:"
              sed 's/^/  | /' /tmp/signoff-guard-merge.log
              echo "fix: this job's actions/checkout must use fetch-depth: 0 -- a depth-1 clone leaves origin/main with no common ancestor (see the checkout step above)"
              exit 1
            fi
            echo "::error::stale base: merging the current origin/main tip into this PR head conflicts, so the signoff gate cannot evaluate the tree that would land"
            cat /tmp/signoff-guard-merge.log
            # exact member-path match only: raw-text grep would false-match
            # inventory description prose that merely mentions the path
          python3 - signoff/item-*-inventory.json /tmp/signoff-conflicted.txt <<'PY'
          import json, sys
          invs, conflicted = sys.argv[1:-1], [l.strip() for l in open(sys.argv[-1]) if l.strip()]
          def walk(v):
              if isinstance(v, str):
                  yield v
              elif isinstance(v, dict):
                  for x in v.values():
                      yield from walk(x)
              elif isinstance(v, list):
                  for x in v:
                      yield from walk(x)
          members = {}
          for f in invs:
              for s in walk(json.load(open(f))):
                  members.setdefault(s, []).append(f)
          print("conflicting files (inventoried ones named with their pinning inventory):")
          for p in conflicted:
              hits = members.get(p)
              if hits:
                  print(f"  {p} -> pinned by {' '.join(hits)}")
              else:
                  print(f"  {p} -> (not inventoried)")
          PY
            echo "remedy: git fetch origin main && git rebase origin/main, then re-attest the item(s) whose inventory contains the conflicting path(s) -- klt signoff --attest N --inventory signoff/item-N-inventory.json -o signoff/item-N-<name>.json -- and refresh the envelope + manifest pins + signoff/tier-report.json (see signoff/README.md, Regenerate and verify)"
            git merge --abort || true
            exit 1
          fi
          echo "run-time merge with origin/main: done (Already up to date == the common case, no new failure mode)"

      - name: Regression-test the pin checker itself (issue #281)
        # python3 + git only, so it runs before the klt install: signoff/
        # verify-pins.sh's multi-input branch must catch a tampered member of
        # item 1's input set (flow/test_verify_pins.sh tampers a tempdir copy).
        run: ./flow/test_verify_pins.sh

      - name: Regression-test the signoff --target flag (issue #259)
        # python3 + git only, so it also runs before the klt install: the
        # harnesses are exercised through stub binaries
        # (flow/test_signoff_target.sh builds its own fake klt/openroad/yosys
        # and needs no PDK or network), so this runs on a bare runner.
        run: ./flow/test_signoff_target.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the pinned klt (klayout-tools)
        run: |
          uv tool install "klayout-tools==0.9.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          klt --version

      - name: Verify every manifest pin against the live artifacts
        run: |
          set +e
          ./signoff/verify-pins.sh 2>&1 | tee /tmp/pins-merged.log
          rc="${PIPESTATUS[0]}"
          set -e
          if [ "$rc" -ne 0 ]; then
            if [ -f /tmp/pins-pr-branch.rc ] && [ "$(cat /tmp/pins-pr-branch.rc)" -eq 0 ]; then
              echo "::error::STALE BASE: the signoff gate passes on this PR ref alone but fails once the current origin/main tip is merged in -- a concurrent PR moved bytes this PR's attestation pins (or vice versa) and git merged the disjoint file sets cleanly (the #297/#298 shape, issue #304)"
              sed -nE 's/^ +FAIL +item-([0-9]+) attestation pin for ([^ ]+) == live bytes.*/re-attest item \1 (its inventory pins \2)/p' /tmp/pins-merged.log | sed 's/^/  remedy: /'
              echo "rebase onto origin/main (git fetch origin main && git rebase origin/main), then re-attest the item(s) named above, refresh the envelope + manifest pins, and regenerate signoff/tier-report.json -- see signoff/README.md, Regenerate and verify"
            fi
            exit 1
          fi
          if [ -f /tmp/pins-pr-branch.rc ]; then
            if [ "$(cat /tmp/pins-pr-branch.rc)" -eq 1 ]; then
              echo "note: the gate failed on the checked-out PR ref but passes on the merge with origin/main -- origin/main appears to already carry the fix; rebase onto it"
            fi
          fi

      - name: Re-attest items 1, 9 and 10 against the committed envelopes
        run: |
          # exit 3 = drift (an inventoried file changed, or a check failed).
          # Item 1's yosys freshness command is local_only, so it is carried
          # from the committed envelope here; every file is still re-hashed.
          for pair in 1:design-sources 9:testbenches 10:repo-hygiene; do
            item="${pair%%:*}"; name="${pair#*:}"
            klt signoff --attest "$item" \
              --inventory "signoff/item-$item-inventory.json" \
              --check "signoff/item-$item-$name.json"
          done

      - name: Re-run klt signoff and diff against the committed tier report
        run: |
          set +e
          klt signoff --manifest signoff/block-manifest.json --format json > /tmp/tier-report-fresh.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "klt signoff failed (exit $rc):"
            cat /tmp/tier-report-fresh.json
            exit 1
          fi
          if [ "$rc" -eq 3 ]; then
            echo "note: block is not yet T1 (klt signoff exit 3) -- expected until every item is met"
          fi
          if ! diff -u \
              <(python3 -m json.tool signoff/tier-report.json) \
              <(python3 -m json.tool /tmp/tier-report-fresh.json); then
            echo "::error::fresh klt signoff grade differs from the committed record signoff/tier-report.json"
            echo "Regenerate the record against the changed evidence:"
            echo "  klt signoff --manifest signoff/block-manifest.json --format json > signoff/tier-report.json"
            echo "and update the manifest's content_hash pins if a cited artifact was regenerated."
            exit 1
          fi
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/tier-report-fresh.json"))
          met = [i for i in r["items"] if i["tier"] == "T1" and i["status"] == "met"]
          print(f'signoff record reproduced: tier={r["tier"]} '
                f'{r["t1_met_count"]}/{r["t1_item_count"]} T1 items met')
          for i in sorted(met, key=lambda x: x["id"] or 0):
              print(f'  met   item {i["id"]}: {i["title"]}')
          PY

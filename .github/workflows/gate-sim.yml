# Zero-delay gate-level re-sims on pull requests (issue #130).
#
# Runs flow/gate-sim-bitstream.sh --negative (#119) and flow/gate-sim-routed.sh
# (#112; #135 extends the former to replay every indexed routability-corpus
# fixture in sim/bitstream/corpus/index.txt): the UNMODIFIED sim/tb_logic_tile_bitstream.v and
# sim/tb_logic_tile_routed.v against the committed synthesized netlist
# layout/experimental/logic_tile_routed.synth.v and the sky130_fd_sc_hd
# behavioral Verilog models. A broken netlist, RTL/fixture drift or a wrong
# result fails the job (the --negative mode additionally proves the pass
# criterion rejects a wrong bitstream and a corrupted netlist).
#
# Since issue #177 the bitstream gate also replays the 73-stream LUT-address basis
# (flow/lut_basis.py -> sim/tb_lut_basis.v; consumes flow/fasm_to_bitstream.py and
# sim/bitstream/fabric_spec.json + logic4_configmem.map) against the same netlist.
#
# Since issue #189 it also replays the three route diagnostic suites against the same
# netlist (flow/gate_route_diag.sh): flow/route_diag.py -> sim/tb_route_diag.v,
# flow/ctrl_route.py -> sim/tb_ctrl_route.v, flow/output_route.py -> sim/tb_output_route.v,
# with legal-other-source negative controls (flow/route_diag_negative.py); every one of
# those files is a path trigger below. Their logs (flow/build/gate-sim-bitstream/*.log)
# are uploaded by the last step whether the job passes or fails.
#
# Label: experimental same-index switch matrix (ADR-0004/0005 Proposed),
# zero-delay, functional only. No SDF/timing and no ratified-fabric claim;
# this workflow only schedules checks that already exist.
#
# How CI obtains the sky130_fd_sc_hd Verilog models (decision, issue #130):
#   * `ciel` (the volare successor; PyPI, Apache-2.0) run through `uvx` in a
#     throwaway environment, pinned to CIEL_VERSION below, enables the sky130
#     PDK with ONLY the sky130_fd_sc_hd library (-l sky130_fd_sc_hd) into
#     $RUNNER_TEMP/pdk. Nothing is installed host-wide and no klt is needed:
#     both gate-sim scripts fall back to $PDK_ROOT/sky130A/libs.ref/... when
#     `klt` is absent.
#   * PDK_OPEN_PDKS_REV pins the open_pdks revision explicitly. The revision
#     recorded in flow/tool_versions.sh (RECORDED_PDK_VERSION, c6d73a35...)
#     is NOT published in the ciel-releases index (404), so it cannot be
#     fetched. The pinned a492ff78... is the nearest published revision; its
#     sky130_fd_sc_hd.v and primitives.v are byte-identical to the recorded
#     revision's, and this job asserts that with the two sha256 values now
#     read from flow/tool_versions.sh (RECORDED_PDK_MODELS_SHA256 /
#     RECORDED_PDK_PRIMITIVES_SHA256 -- the single committed source, shared
#     with sim/sdf_port_interconnect/run.sh's hash gate so a future model
#     bump cannot leave the two asserting different values, issue #269). If
#     a future bump changes the models, that step fails loudly rather than
#     silently simulating different cells.
#
#   * Since issue #269 this workflow also runs
#     sim/sdf_port_interconnect/run.sh -- the committed regression guard for
#     record 20261114-sdf-port-interconnect-564db73 (issue #250) -- against
#     these same fetched models: the fixture resolves the flat ciel layout
#     via its own hash gate reading the same recorded values, so nothing
#     here needs to be exported to it beyond PDK_ROOT.
#   * Rejected alternative: a sparse checkout of google/skywater-pdk cell
#     sources; the combined sky130_fd_sc_hd.v / primitives.v the scripts read
#     are generated by open_pdks, so it would not be the same files.
#   * iverilog 13.0 is built from the upstream tag on the ephemeral CI runner
#     (cached), NOT apt's 12.0: see the comment on the build step.
name: gate-sim

on:
  pull_request:
    paths:
      - 'design/rtl/**'
      - 'layout/experimental/**'
      - 'sim/tb_logic_tile*.v'
      - 'sim/tb_lut_basis.v'
      - 'flow/lut_basis.py'
      - 'flow/fasm_to_bitstream.py'
      - 'sim/tb_route_diag.v'
      - 'sim/tb_ctrl_route.v'
      - 'sim/tb_output_route.v'
      - 'flow/route_diag.py'
      - 'flow/ctrl_route.py'
      - 'flow/output_route.py'
      - 'flow/route_diag_negative.py'
      - 'flow/test_route_diag_negative.py'
      - 'flow/gate_route_diag.sh'
      - 'flow/test_gate_route_diag.sh'
      - 'flow/check_regbel_fixtures.py'
      - 'sim/bitstream/**'
      - 'flow/gate-sim-bitstream.sh'
      - 'flow/gate_sim_verdict.sh'
      - 'flow/test_gate_sim_verdict.sh'
      - 'flow/configmem_bad_inputs.py'
      - 'design/fabulous/tb_configmem_equiv.v'
      - 'flow/test_sim_budget.sh'
      - 'flow/sim_budget.py'
      - 'sim/pin_fixture_replay.sh'
      - 'sim/pin_fixture_negative.sh'
      - 'flow/gate-sim-routed.sh'
      - 'sim/sdf_port_interconnect/**'
      - 'measurements/timing-characterization/records/20261114-sdf-port-interconnect-564db73.md'
      - 'flow/tool_versions.sh'
      - '.github/workflows/gate-sim.yml'

permissions:
  contents: read

env:
  IVERILOG_TAG: 'v13_0'
  CIEL_VERSION: '3.0.1'
  PDK_OPEN_PDKS_REV: 'a492ff787163f93ce9ebc382b23c58c0de33afa3'
  # The two expected model sha256 values used to live here; they moved to
  # flow/tool_versions.sh (RECORDED_PDK_MODELS_SHA256 /
  # RECORDED_PDK_PRIMITIVES_SHA256) so the workflow and
  # sim/sdf_port_interconnect/run.sh read one committed source (issue #269).
  # A YAML env: block cannot source a shell file, so the fetch step below
  # sources flow/tool_versions.sh to read them.

jobs:
  gate-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Icarus 13.0 is pinned (built from the upstream tag, cached): the
      # committed sim/*_gate_results.txt evidence was produced with 13.0, and
      # apt's 12.0 on ubuntu-24.04 produces a different result on the
      # registered (top_reg) fixture of the gate netlist (baseline: 6385
      # checks, 6384 failures; reproduced locally with a throwaway 12.0 build).
      - name: Cache Icarus Verilog ${{ env.IVERILOG_TAG }}
        id: ivl-cache
        uses: actions/cache@v4
        with:
          path: ~/iverilog-inst
          key: iverilog-${{ env.IVERILOG_TAG }}-${{ runner.os }}-ubuntu-24.04

      - name: Build Icarus Verilog ${{ env.IVERILOG_TAG }}
        if: steps.ivl-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf gperf flex bison make g++ git ca-certificates
          git clone --depth 1 --branch "$IVERILOG_TAG" \
            https://github.com/steveicarus/iverilog "$RUNNER_TEMP/iverilog-src"
          cd "$RUNNER_TEMP/iverilog-src"
          sh autoconf.sh
          ./configure --prefix="$HOME/iverilog-inst"
          make -j2
          make install

      - name: Select pinned Icarus Verilog
        run: |
          echo "$HOME/iverilog-inst/bin" >> "$GITHUB_PATH"
          "$HOME/iverilog-inst/bin/iverilog" -V | head -n 1
          "$HOME/iverilog-inst/bin/iverilog" -V | head -n 1 | grep -q 'version 13\.0 '

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Fetch pinned sky130_fd_sc_hd models (ciel, throwaway root)
        run: |
          PDK_ROOT="$RUNNER_TEMP/pdk"
          uvx --from "ciel==${CIEL_VERSION}" ciel enable \
            --pdk-root "$PDK_ROOT" --pdk-family sky130 \
            -l sky130_fd_sc_hd "$PDK_OPEN_PDKS_REV"
          # Expected hashes from the shared committed source, not env:
          # flow/tool_versions.sh defines variables and functions only; it
          # runs no tool (issue #269).
          source flow/tool_versions.sh
          d="$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/verilog"
          echo "${RECORDED_PDK_MODELS_SHA256}  $d/sky130_fd_sc_hd.v" | sha256sum -c -
          echo "${RECORDED_PDK_PRIMITIVES_SHA256}  $d/primitives.v" | sha256sum -c -
          echo "PDK_ROOT=$PDK_ROOT" >> "$GITHUB_ENV"

      - name: Verdict classifier regression (no simulator needed)
        run: ./flow/test_gate_sim_verdict.sh

      - name: Simulation wall-clock budget regression (stub simulators, issue #157)
        run: ./flow/test_sim_budget.sh

      - name: Route-diagnostic negative-control assembler unit tests (no simulator needed)
        run: python3 -I flow/test_route_diag_negative.py

      - name: Route-diagnostic gate replay failure-mode regression (issue #189)
        run: ./flow/test_gate_route_diag.sh

      - name: Gate-level bitstream re-sim (with negative checks)
        run: ./flow/gate-sim-bitstream.sh --negative

      - name: Gate-level routed re-sim
        run: ./flow/gate-sim-routed.sh

      # The committed regression guard for record
      # 20261114-sdf-port-interconnect-564db73 (issue #250): re-runs the
      # measured verdicts, rejected-entry counts and the 28-rejection
      # prediction against the same fetched models. Icarus 13.0 is already
      # on $PATH from the Select step (the fixture resolves it there; no
      # ICARUS13_BIN_DIR export is needed) and PDK_ROOT from the fetch step;
      # the fixture hash-gates the flat ciel layout itself (issue #269).
      - name: SDF INTERCONNECT fanout reproducer (20261114 record guard)
        run: ./sim/sdf_port_interconnect/run.sh

      # always(): includes failure, so the route-diagnostic and other gate logs are
      # available exactly when a step fails
      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-sim-logs
          path: flow/build/gate-sim-*/*.log
          if-no-files-found: warn
          retention-days: 14

# Zero-delay gate-level re-sims on pull requests (issue #130).
#
# Runs flow/gate-sim-bitstream.sh --negative (#119) and flow/gate-sim-routed.sh
# (#112): the UNMODIFIED sim/tb_logic_tile_bitstream.v and
# sim/tb_logic_tile_routed.v against the committed synthesized netlist
# layout/experimental/logic_tile_routed.synth.v and the sky130_fd_sc_hd
# behavioral Verilog models. A broken netlist, RTL/fixture drift or a wrong
# result fails the job (the --negative mode additionally proves the pass
# criterion rejects a wrong bitstream and a corrupted netlist).
#
# Label: experimental same-index switch matrix (ADR-0004/0005 Proposed),
# zero-delay, functional only. No SDF/timing and no ratified-fabric claim;
# this workflow only schedules checks that already exist.
#
# How CI obtains the sky130_fd_sc_hd Verilog models (decision, issue #130):
#   * `ciel` (the volare successor; PyPI, Apache-2.0) run through `uvx` in a
#     throwaway environment, pinned to CIEL_VERSION below, enables the sky130
#     PDK with ONLY the sky130_fd_sc_hd library (-l sky130_fd_sc_hd) into
#     $RUNNER_TEMP/pdk. Nothing is installed host-wide and no klt is needed:
#     both gate-sim scripts fall back to $PDK_ROOT/sky130A/libs.ref/... when
#     `klt` is absent.
#   * PDK_OPEN_PDKS_REV pins the open_pdks revision explicitly. The revision
#     recorded in flow/tool_versions.sh (RECORDED_PDK_VERSION, c6d73a35...)
#     is NOT published in the ciel-releases index (404), so it cannot be
#     fetched. The pinned a492ff78... is the nearest published revision; its
#     sky130_fd_sc_hd.v and primitives.v are byte-identical to the recorded
#     revision's, and this job asserts that with the sha256 values below
#     (taken from the models used for sim/*_gate_results.txt). If a future
#     bump changes the models, that step fails loudly rather than silently
#     simulating different cells.
#   * Rejected alternative: a sparse checkout of google/skywater-pdk cell
#     sources; the combined sky130_fd_sc_hd.v / primitives.v the scripts read
#     are generated by open_pdks, so it would not be the same files.
#   * iverilog 13.0 is built from the upstream tag on the ephemeral CI runner
#     (cached), NOT apt's 12.0: see the comment on the build step.
name: gate-sim

on:
  pull_request:
    paths:
      - 'design/rtl/**'
      - 'layout/experimental/**'
      - 'sim/tb_logic_tile*.v'
      - 'sim/bitstream/**'
      - 'flow/gate-sim-bitstream.sh'
      - 'flow/gate-sim-routed.sh'
      - '.github/workflows/gate-sim.yml'

permissions:
  contents: read

env:
  IVERILOG_TAG: 'v13_0'
  CIEL_VERSION: '3.0.1'
  PDK_OPEN_PDKS_REV: 'a492ff787163f93ce9ebc382b23c58c0de33afa3'
  MODELS_SHA256: '12d5d6448ccf265c544d88402d5c10ab6de9bee8b8cde48eee1f31ea8c3c3e45'
  PRIMITIVES_SHA256: '7d4b1441d06b0f2b9662befa675a0484d77149e04eb42a5f1fa2d4cfded7b2ce'

jobs:
  gate-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Icarus 13.0 is pinned (built from the upstream tag, cached): the
      # committed sim/*_gate_results.txt evidence was produced with 13.0, and
      # apt's 12.0 on ubuntu-24.04 produces a different result on the
      # registered (top_reg) fixture of the gate netlist (baseline: 6385
      # checks, 6384 failures; reproduced locally with a throwaway 12.0 build).
      - name: Cache Icarus Verilog ${{ env.IVERILOG_TAG }}
        id: ivl-cache
        uses: actions/cache@v4
        with:
          path: ~/iverilog-inst
          key: iverilog-${{ env.IVERILOG_TAG }}-${{ runner.os }}-ubuntu-24.04

      - name: Build Icarus Verilog ${{ env.IVERILOG_TAG }}
        if: steps.ivl-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf gperf flex bison make g++ git ca-certificates
          git clone --depth 1 --branch "$IVERILOG_TAG" \
            https://github.com/steveicarus/iverilog "$RUNNER_TEMP/iverilog-src"
          cd "$RUNNER_TEMP/iverilog-src"
          sh autoconf.sh
          ./configure --prefix="$HOME/iverilog-inst"
          make -j2
          make install

      - name: Select pinned Icarus Verilog
        run: |
          echo "$HOME/iverilog-inst/bin" >> "$GITHUB_PATH"
          "$HOME/iverilog-inst/bin/iverilog" -V | head -n 1
          "$HOME/iverilog-inst/bin/iverilog" -V | head -n 1 | grep -q 'version 13\.0 '

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Fetch pinned sky130_fd_sc_hd models (ciel, throwaway root)
        run: |
          PDK_ROOT="$RUNNER_TEMP/pdk"
          uvx --from "ciel==${CIEL_VERSION}" ciel enable \
            --pdk-root "$PDK_ROOT" --pdk-family sky130 \
            -l sky130_fd_sc_hd "$PDK_OPEN_PDKS_REV"
          d="$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/verilog"
          echo "${MODELS_SHA256}  $d/sky130_fd_sc_hd.v" | sha256sum -c -
          echo "${PRIMITIVES_SHA256}  $d/primitives.v" | sha256sum -c -
          echo "PDK_ROOT=$PDK_ROOT" >> "$GITHUB_ENV"

      - name: Gate-level bitstream re-sim (with negative checks)
        run: ./flow/gate-sim-bitstream.sh --negative

      - name: Gate-level routed re-sim
        run: ./flow/gate-sim-routed.sh

      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-sim-logs
          path: flow/build/gate-sim-*/*.log
          if-no-files-found: warn
          retention-days: 14
